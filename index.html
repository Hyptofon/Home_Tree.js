<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3D third-person character controller — Three.js + Rapier + TypeScript" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>3D Character Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>

    <!-- Loading overlay -->
    <div id="loader">
      <div class="loader-title">Loading Scene</div>
      <div class="spinner"></div>
      <p id="loading-text">Loading character &amp; animations…</p>
    </div>

    <!-- Main canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- HUD: keyboard hints -->
    <nav id="hud" aria-label="Controls">
      <div class="hud-panel">
        <div class="hud-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          SYSTEM CONTROLS
        </div>
        <div class="key-list">
          <div class="key-row">
            <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
            <span class="label">Movement</span>
          </div>
          <div class="key-row">
            <div class="keys"><kbd>⇧ Shift</kbd> + <kbd>W</kbd></div>
            <span class="label">Sprint</span>
          </div>
          <div class="key-row">
            <div class="keys"><kbd>Space</kbd></div>
            <span class="label">Jump</span>
          </div>
          <div class="key-row">
            <div class="keys"><kbd>C</kbd></div>
            <span class="label">Camera View</span>
          </div>
        </div>
      </div>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
